name: Build Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          git clone --recursive https://github.com/theos/sdks $HOME/theos/sdks

      - name: Install ldid
        run: |
          brew install ldid dpkg

      - name: Build
        env:
          THEOS: /Users/runner/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: snowingcats-deb
          path: packages/*.deb
