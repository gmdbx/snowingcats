name: Build Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential clang fakeroot libtinfo6 perl zstd xz-utils

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --recursive https://github.com/theos/sdks $HOME/theos/sdks

      - name: Install toolchain
        run: |
          curl -LO https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz
          echo "=== Archive contents (clang-related) ==="
          tar -tf swift-5.8-ubuntu22.04.tar.xz | grep -E "(clang|host)" | head -30
          echo "=== Extracting ==="
          tar -xf swift-5.8-ubuntu22.04.tar.xz
          echo "=== Top level ==="
          ls -la
          echo "=== linux dir ==="
          ls -la linux/ 2>/dev/null || echo "no linux dir"
          echo "=== linux/iphone dir ==="
          ls -la linux/iphone/ 2>/dev/null || echo "no linux/iphone dir"
          echo "=== linux/iphone/bin dir ==="
          ls -la linux/iphone/bin/ 2>/dev/null || echo "no linux/iphone/bin"
          echo "=== Looking for real clang binary ==="
          find . -name "clang*" -type f -executable 2>/dev/null | head -20
          echo "=== Looking for host dir ==="
          find . -type d -name "host" 2>/dev/null
          echo "=== Copying toolchain ==="
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cp -r linux/iphone/* $HOME/theos/toolchain/linux/iphone/
          echo "=== After copy ==="
          ls -la $HOME/theos/toolchain/linux/iphone/bin/ | head -20

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus2/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Build
        env:
          THEOS: /home/runner/theos
        run: |
          echo "=== Finding real clang ==="
          find $THEOS/toolchain -name "clang" -type f 2>/dev/null
          echo "=== Finding host dir ==="
          find $THEOS/toolchain -type d -name "host" 2>/dev/null
          echo "=== Full toolchain tree ==="
          find $THEOS/toolchain -maxdepth 4 -type d | sort
          echo "=== Fixing broken symlinks ==="
          # Find where clang really is
          REAL_CLANG=$(find $THEOS/toolchain -name "clang" -type f 2>/dev/null | head -1)
          echo "Real clang at: $REAL_CLANG"
          if [ -n "$REAL_CLANG" ]; then
            CLANG_DIR=$(dirname "$REAL_CLANG")
            echo "Clang dir: $CLANG_DIR"
            # Remove broken symlink and copy real file
            rm -f $THEOS/toolchain/linux/iphone/bin/clang
            cp "$REAL_CLANG" $THEOS/toolchain/linux/iphone/bin/clang
            chmod +x $THEOS/toolchain/linux/iphone/bin/clang
            # Same for clang++
            REAL_CLANGXX=$(find $THEOS/toolchain -name "clang++" -type f 2>/dev/null | head -1)
            if [ -n "$REAL_CLANGXX" ]; then
              rm -f $THEOS/toolchain/linux/iphone/bin/clang++
              cp "$REAL_CLANGXX" $THEOS/toolchain/linux/iphone/bin/clang++
              chmod +x $THEOS/toolchain/linux/iphone/bin/clang++
            fi
          fi
          echo "=== Testing clang ==="
          $THEOS/toolchain/linux/iphone/bin/clang --version || echo "clang still failed"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: snowingcats-deb
          path: packages/*.deb
