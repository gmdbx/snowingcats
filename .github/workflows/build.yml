name: Build Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential clang fakeroot libtinfo6 perl zstd xz-utils

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --recursive https://github.com/theos/sdks $HOME/theos/sdks

      - name: Install toolchain
        run: |
          curl -LO https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz
          echo "=== Archive contents (clang/host) ==="
          tar -tf swift-5.8-ubuntu22.04.tar.xz | grep -E "(clang$|clang\+\+$|host/bin)" | head -20
          echo "=== Extracting ==="
          tar -xf swift-5.8-ubuntu22.04.tar.xz
          echo "=== Top level dirs ==="
          ls -la
          echo "=== linux dir ==="
          ls -la linux/
          echo "=== linux/iphone/bin ==="
          ls -la linux/iphone/bin/ | head -20
          echo "=== Looking for real clang binary ==="
          find . -name "clang" -type f -executable 2>/dev/null
          find . -name "clang++" -type f -executable 2>/dev/null
          echo "=== Looking for host dir ==="
          find . -type d -name "host" 2>/dev/null
          echo "=== host/bin contents ==="
          ls -la host/bin/ 2>/dev/null || echo "no host/bin"
          ls -la linux/iphone/host/bin/ 2>/dev/null || echo "no linux/iphone/host/bin"
          echo "=== Copying toolchain with dereference ==="
          mkdir -p $HOME/theos/toolchain/linux/iphone
          # Use -L to follow symlinks and copy real files
          cp -rL linux/iphone/* $HOME/theos/toolchain/linux/iphone/
          echo "=== After copy ==="
          ls -la $HOME/theos/toolchain/linux/iphone/bin/ | head -20
          echo "=== Test clang ==="
          $HOME/theos/toolchain/linux/iphone/bin/clang --version || echo "clang failed"

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus2/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Build
        env:
          THEOS: /home/runner/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: snowingcats-deb
          path: packages/*.deb
