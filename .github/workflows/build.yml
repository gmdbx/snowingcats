name: Build Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential clang fakeroot libtinfo6 perl zstd xz-utils

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --recursive https://github.com/theos/sdks $HOME/theos/sdks

      - name: Install toolchain
        run: |
          curl -LO https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz
          echo "=== Archive contents (first 30) ==="
          tar -tf swift-5.8-ubuntu22.04.tar.xz | head -30
          echo "=== Extracting ==="
          tar -xf swift-5.8-ubuntu22.04.tar.xz
          echo "=== Top level ==="
          ls -la
          echo "=== linux dir ==="
          ls -la linux/ 2>/dev/null || echo "no linux dir"
          echo "=== linux/iphone dir ==="
          ls -la linux/iphone/ 2>/dev/null || echo "no linux/iphone dir"
          echo "=== All clang files ==="
          find . -name "clang" -type f 2>/dev/null
          find . -name "clang++" -type f 2>/dev/null
          echo "=== Copying toolchain ==="
          mkdir -p $HOME/theos/toolchain/linux/iphone
          if [ -d "linux/iphone" ]; then
            cp -r linux/iphone/* $HOME/theos/toolchain/linux/iphone/
            echo "Copied from linux/iphone/"
          elif [ -d "linux" ]; then
            cp -r linux/* $HOME/theos/toolchain/linux/
            echo "Copied from linux/"
          else
            echo "No linux dir found, searching..."
            CLANG_PATH=$(find . -name "clang" -type f | head -1)
            echo "Found clang at: $CLANG_PATH"
          fi
          echo "=== Final toolchain structure ==="
          ls -la $HOME/theos/toolchain/linux/iphone/
          echo "=== bin dir ==="
          ls -la $HOME/theos/toolchain/linux/iphone/bin/ 2>/dev/null || echo "no bin dir"

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus2/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Build
        env:
          THEOS: /home/runner/theos
        run: |
          echo "=== Toolchain structure ==="
          find $THEOS/toolchain -type f | head -50
          echo "=== bin dir ==="
          ls -la $THEOS/toolchain/linux/iphone/bin/ 2>/dev/null || echo "no bin"
          echo "=== Looking for clang ==="
          find $THEOS/toolchain -name "clang*" 2>/dev/null
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: snowingcats-deb
          path: packages/*.deb
