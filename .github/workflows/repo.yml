name: Build and Deploy Repo

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential clang fakeroot libtinfo6 perl zstd xz-utils dpkg-dev

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --recursive https://github.com/theos/sdks $HOME/theos/sdks

      - name: Install toolchain
        run: |
          curl -LO https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz
          tar -xf swift-5.8-ubuntu22.04.tar.xz
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cp -rL linux/iphone/* $HOME/theos/toolchain/linux/iphone/
          chmod -R +x $HOME/theos/toolchain/linux/iphone/bin/ 2>/dev/null || true

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus2/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Build
        env:
          THEOS: /home/runner/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          rm -rf packages/
          make clean
          make package FINALPACKAGE=1

      - name: Create repo structure
        run: |
          mkdir -p repo/debs
          cp packages/*.deb repo/debs/
          
          cd repo
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -fks Packages
          
          cat > Release << 'EOF'
          Origin: SnowingCats Repo
          Label: SnowingCats
          Suite: stable
          Version: 1.0
          Codename: snowingcats
          Architectures: iphoneos-arm64
          Components: main
          Description: Snowing Cats tweak repository
          EOF

      - name: Deploy to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git clone --branch gh-pages --single-branch https://github.com/gmdbx/snowingcats.git gh-pages 2>/dev/null || git clone https://github.com/gmdbx/snowingcats.git gh-pages
          cd gh-pages
          
          # Clean and copy new files
          rm -rf debs Packages Packages.bz2 Release
          cp -r ../repo/* .
          
          git add .
          git commit -m "Update repo $(date)" || echo "No changes"
          git push origin gh-pages
