name: Build and Deploy Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential clang fakeroot libtinfo6 perl zstd xz-utils dpkg-dev

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --recursive https://github.com/theos/sdks $HOME/theos/sdks

      - name: Install toolchain
        run: |
          curl -LO https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz
          tar -xf swift-5.8-ubuntu22.04.tar.xz
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cp -rL linux/iphone/* $HOME/theos/toolchain/linux/iphone/
          chmod -R +x $HOME/theos/toolchain/linux/iphone/bin/ 2>/dev/null || true

      - name: Install ldid
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus2/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Build
        env:
          THEOS: /home/runner/theos
        run: |
          export PATH="$THEOS/bin:$PATH"
          rm -rf packages/
          make clean
          make package FINALPACKAGE=1

      - name: Create repo
        run: |
          mkdir -p repo_output/debs
          cp packages/*.deb repo_output/debs/
          
          cd repo_output
          dpkg-scanpackages -m debs /dev/null > Packages
          bzip2 -fks Packages
          
          cat > Release << 'EOF'
          Origin: SnowingCats Repo
          Label: SnowingCats
          Suite: stable
          Version: 1.0
          Codename: snowingcats
          Architectures: iphoneos-arm64
          Components: main
          Description: Snowing Cats tweak repository
          EOF
          
          echo "=== Repo contents ==="
          ls -la
          ls -la debs/

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Clone gh-pages in isolated directory OUTSIDE the workspace
          git clone --branch gh-pages --single-branch --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/gmdbx/snowingcats.git /tmp/gh-pages-deploy || {
            # If gh-pages doesn't exist, create orphan
            mkdir -p /tmp/gh-pages-deploy
            cd /tmp/gh-pages-deploy
            git init
            git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/gmdbx/snowingcats.git
            git checkout --orphan gh-pages
            cd /
          }
          
          cd /tmp/gh-pages-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Remove ALL files except .git
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} +
          
          # Copy ONLY repo files
          cp -r "$GITHUB_WORKSPACE/repo_output/." .
          
          echo "=== Deploying ==="
          ls -la
          
          git add -A
          git commit -m "Repo update $(date)"
          git push origin gh-pages --force
